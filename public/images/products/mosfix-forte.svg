  <text x="300" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#9A8E88" text-anchor="middle">Medomas Healthcare Pvt. Ltd. • Placeholder Pack Artwork</text>
