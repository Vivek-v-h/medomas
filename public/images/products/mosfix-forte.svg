    <rect x="140" y="132" width="320" height="2" fill="#DF0000" opacity="0.2"/>
    
    <text x="140" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#532416" letter-spacing="-0.5">MOSFIX FORTE</text>
    
    <rect x="140" y="200" width="80" height="22" rx="6" fill="#DF0000" opacity="0.15"/>
    <text x="152" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#DF0000" letter-spacing="1">TABLETS</text>
    
    <text x="140" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#766A65" letter-spacing="1">COMPOSITION:</text>
